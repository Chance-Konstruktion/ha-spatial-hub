[pytest]
# Eigene Konfiguration fuer die Tests gegen ein echtes Home Assistant.
#
# Sie koennen nicht im selben Lauf stehen wie tests/: dessen conftest.py
# ersetzt das ganze Paket ``homeassistant`` in sys.modules durch Attrappen.
# Was danach ``import homeassistant`` sagt, bekommt die Attrappe -- egal
# wie echt die Installation daneben ist. Zwei Verzeichnisse, zwei Laeufe.
testpaths = tests_ha
# Die Wurzel, damit ``custom_components.spatial_hub`` importierbar ist,
# und tests_ha selbst fuer hilfen.py.
pythonpath = . tests_ha
asyncio_mode = auto

# Ein leerer Parametersatz ist ein Fehler, keine Auslassung.
#
# Voreingestellt meldet pytest so einen Test als "skipped" mit dem Grund
# "got empty parameter set" -- und eine Auslassung liest sich in einem
# gruenen Lauf wie eine Kleinigkeit. Genau so hat
# `test_every_local_link_resolves` monatelang nichts geprueft: Seine
# Dateiliste war leer, weil ein Filter den absoluten Pfad ansah und das
# Repository unter einem Ordner mit Punkt im Namen lag. In der CI lief
# der Test, auf dem Entwicklerrechner nicht -- und niemand sah es.
#
# `fail_at_collect` macht daraus einen roten Lauf, und zwar fuer jeden
# kuenftigen Fall dieser Art, nicht nur fuer den einen gefundenen.
empty_parameter_set_mark = fail_at_collect
