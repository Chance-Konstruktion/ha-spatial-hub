# CI fuer Spatial Hub
#
# Ersetzt .github/workflows/tests.yml. Zwei Unterschiede zur GitHub-Fassung
# sind Absicht:
#
# 1. Node wird ausdruecklich installiert. tests/test_check_renderer.py
#    ueberspringt sich selbst, wenn Node fehlt -- die Pipeline waere gruen,
#    ohne dass die Renderer-Pruefungen je gelaufen waeren. Mit -rs steht
#    ausserdem im Log, was uebersprungen wurde und warum.
#
# 2. Die Abhaengigkeiten werden aus requirements_test.txt gelesen, wenn es
#    die Datei gibt. Auf main gibt es sie (noch) nicht, auf dem
#    Renderer-Branch schon. Ein fester Satz als Rueckfall haelt beide
#    Zweige gruen, ohne dass jemand die Datei nachpflegen muss.

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

pytest:
  stage: test
  image: python:3.13
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs
    - node --version
    - python --version
    - |
      if [ -f requirements_test.txt ]; then
        echo "Abhaengigkeiten aus requirements_test.txt"
        pip install -q -r requirements_test.txt
      else
        echo "requirements_test.txt fehlt -- fester Satz"
        pip install -q pytest pytest-asyncio voluptuous pyyaml jsonschema
      fi
  script:
    - python -m pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report.xml
