name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest pytest-asyncio
      # The renderer's own test suite runs from here too, so one command
      # covers both languages. Node is present on ubuntu-latest.
      - name: Run unit tests
        run: python -m pytest -q
