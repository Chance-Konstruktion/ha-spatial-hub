name: "Fehler"
description: "Etwas steht falsch auf dem Grundriss, oder gar nicht."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Wenn Daten einer Integration fehlen oder verworfen wurden, sagt die
        **Diagnose** meistens direkt, warum: im Panel oben rechts, oder über
        `floorplan_hub/diagnostics`. Sie zeigt pro Provider, was geliefert
        und was mit welcher Begründung verworfen wurde. Bitte hier einfügen.
  - type: textarea
    id: what
    attributes:
      label: Was passiert, und was hattest du erwartet?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnose-Ausgabe
      render: json
  - type: input
    id: versions
    attributes:
      label: Versionen
      placeholder: "Home Assistant 2026.7.0, Floorplan-Hub 0.x"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Betroffene Integration
      description: >
        Falls es um eine bestimmte geht. Der Hub bekommt dafür keinen
        Sonderfall — aber wir schauen uns an, ob der Vertrag etwas nicht
        ausdrücken kann.
